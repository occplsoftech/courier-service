# Shared development environment.
spring:
  jpa:
    show-sql: false
  flyway:
    enabled: true

app:
  # The company whose zone tariff the public website shows; empty switches public rates off.
  public-rates:
    company-code: OCCPL
  cors:
    # Public website: tracking and rates only (see CorsProperties#trackingOrigins).
    tracking-origins:
      - https://pro.occpllogistics.com
    allowed-origins:
      - https://app-dev.courier.example
      - https://skra.in
      - https://app.skra.in
      - https://admin.skra.in
      - https://amazing.skra.in
      - https://vendor.amazinglpl.com
      - https://courier.skra.in

logging:
  level:
    com.courier: DEBUG
