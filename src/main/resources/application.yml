spring:
  application:
    name: courier-management

  profiles:
    default: local

  # Virtual threads: the workload is IO-bound (MySQL + Redis), so unbinding
  # request concurrency from the OS thread count is close to free throughput.
  # Disabled 2026-08-18: JDK 21 virtual threads + this executable jar's classloader
  # hit a real, reproducible race — a request-handling thread that throws mid-response
  # crashes a second time trying to LOG that error (NoClassDefFoundError: ch/qos/logback
  # /classic/spi/ThrowableProxy, thrown from Tomcat's own SocketProcessor on a
  # VirtualThread), which means the original error is never logged AND the response is
  # never written — the client sees an infinite pending request, not an error. Confirmed
  # live: GET /api/v1/super-admin/dashboard hung forever this way, which is what made the
  # Platform Dashboard page spin on "Loading platform figures..." forever. Same crash
  # signature also hit a background @Scheduled job's thread, so this wasn't limited to
  # one endpoint. Revisit if upgrading Spring Boot/Tomcat/logback fixes the underlying
  # classloading race — the IO-bound-workload rationale above is still valid.
  threads:
    virtual:
      enabled: false

  # No spring.mail.* block here on purpose: Spring Boot only auto-configures a
  # JavaMailSender bean when spring.mail.host is actually present as a resolved property —
  # declaring it here with an empty default (${SMTP_HOST:}) would count as "present" and
  # create a bean with a blank host, silently defeating EmailProviderConfig's own
  # "fails at startup, not at the first send" gate for app.communication.email.enabled. A
  # real deployment sets SPRING_MAIL_HOST/SPRING_MAIL_PORT/SPRING_MAIL_USERNAME/
  # SPRING_MAIL_PASSWORD directly — Spring Boot's relaxed env binding picks them up with
  # no YAML entry needed, and they stay genuinely absent otherwise.

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:courier_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:courier}
    password: ${DB_PASSWORD:courier}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: courier-pool
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      # Was 30000: during a full MySQL outage every request blocked this long
      # waiting for a pooled connection before failing, instead of failing fast
      # (perf-tests/ISSUES.md ISSUE-007). 5s still gives a real query plenty of
      # margin under normal load, but turns an outage into a quick 503 instead
      # of a 30s hang.
      connection-timeout: ${DB_CONNECTION_TIMEOUT:5000}
      idle-timeout: 600000
      max-lifetime: 1800000
      # Shorter than MySQL's wait_timeout so the pool discards a connection
      # before the server does.
      keepalive-time: 300000

  jpa:
    # Flyway owns the schema. Hibernate only checks that it matches the mappings —
    # a mismatch must fail at startup, not at the first query in production.
    hibernate:
      ddl-auto: validate
    open-in-view: false   # lazy loading in a controller hides N+1 queries; force explicit fetching
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true   # better statement-cache hit rate
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    # Forward-only. Never enable clean outside a throwaway database.
    clean-disabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms

  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

  servlet:
    multipart:
      # POD capture includes short delivery videos, wider than the plain-document
      # ceiling every other upload in this project needs.
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}
  # The login JWT carries every effective permission code, so a COMPANY_ADMIN token is ~7.5 KB and
  # grows with each new permission module. Tomcat's 8 KB default for the whole request header block
  # then answers 400 (empty body, nothing in the app log) on any request with a longer URL — found
  # when GET /customer-invoices/{id} 400'd while the shorter list URL worked.
  max-http-request-header-size: 32KB
  error:
    # Errors are rendered by GlobalExceptionHandler; the servlet container must not
    # leak its own stack-trace page.
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false
  compression:
    enabled: true
    mime-types: application/json
  shutdown: graceful

app:
  version: 0.1.0
  # Customer portal (e-commerce-business): rate comparison and external couriers. See
  # MEMORY/modules/customer-portal.md. External couriers stay "not connected" until enabled with credentials.
  customer-portal:
    quote-validity: ${CUSTOMER_PORTAL_QUOTE_VALIDITY:30m}
    provider-timeout: ${CUSTOMER_PORTAL_PROVIDER_TIMEOUT:10s}
    volumetric-divisor: ${CUSTOMER_PORTAL_VOLUMETRIC_DIVISOR:5000}
    default-markup-percent: ${CUSTOMER_PORTAL_DEFAULT_MARKUP_PERCENT:10}
    markup-gst-percent: ${CUSTOMER_PORTAL_MARKUP_GST_PERCENT:18}
    occpl-network-gst-percent: ${CUSTOMER_PORTAL_OCCPL_NETWORK_GST_PERCENT:18}
    # Pay portal bookings from the customer's wallet (debit before the courier call, refund if refused or cancelled).
    # Off until customers have funded wallets. OCCPL's own network is billed at the branch and never debited here.
    wallet-payment:
      enabled: ${CUSTOMER_PORTAL_WALLET_PAYMENT_ENABLED:false}
    shiprocket:
      enabled: ${SHIPROCKET_ENABLED:false}
      base-url: ${SHIPROCKET_BASE_URL:https://apiv2.shiprocket.in}
      email: ${SHIPROCKET_API_EMAIL:}
      password: ${SHIPROCKET_API_PASSWORD:}
      pickup-location: ${SHIPROCKET_PICKUP_LOCATION:}
    delhivery:
      enabled: ${DELHIVERY_ENABLED:false}
      base-url: ${DELHIVERY_BASE_URL:https://track.delhivery.com}
      token: ${DELHIVERY_API_TOKEN:}
      pickup-location: ${DELHIVERY_PICKUP_LOCATION:}
    shipyaari:
      enabled: ${SHIPYAARI_ENABLED:false}
      base-url: ${SHIPYAARI_BASE_URL:https://api-seller.shipyaari.com}
      email: ${SHIPYAARI_API_EMAIL:}
      password: ${SHIPYAARI_API_PASSWORD:}
    # sKart international (DHL, FedEx, UPS, Aramex, Skynet... via one franchisee account). The default base URL is sKart's
    # development system; set SKART_BASE_URL to the live address sKart gives you. Companies connect their own account in
    # Courier Integrations.
    skart:
      enabled: ${SKART_ENABLED:false}
      base-url: ${SKART_BASE_URL:https://devapiv2.skart-express.com/api/v1/booking}
      user-name: ${SKART_USER_NAME:}
      password: ${SKART_PASSWORD:}
    # Booked shipments' delivery status: a background job asks each courier, and couriers may push updates to the
    # webhook address shown in Courier Integrations. See MEMORY/modules/customer-portal.md.
    tracking-sync:
      enabled: ${TRACKING_SYNC_ENABLED:true}
      interval: ${TRACKING_SYNC_INTERVAL:1h}
      batch-size: ${TRACKING_SYNC_BATCH_SIZE:100}
      public-base-url: ${TRACKING_WEBHOOK_BASE_URL:}
  bootstrap:
    # First start only: creates a SUPER_ADMIN when this email is not yet a platform operator. Set both, start once,
    # then remove them. The password must satisfy the normal password policy. No default on purpose.
    super-admin-email: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:}
    super-admin-password: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
  jwt:
    # No default: the app must not be able to start with a secret from the repo.
    secret: ${JWT_SECRET}
    issuer: courier-management
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    clock-skew: 30s
  auth:
    # Per-account lock: protects one account from targeted guessing.
    lockout-threshold: 5
    lockout-duration: 15m
    # Per email+IP throttle: protects the endpoint itself. Higher than the lockout
    # threshold on purpose — see MEMORY/modules/auth.md.
    throttle-max-attempts: 10
    throttle-window: 15m
    max-concurrent-sessions: 5
    remember-me-duration: 30d
    reset-token-ttl: 15m
    verification-token-ttl: 24h
    verification-resend-window: 5m
    app-base-url: ${APP_BASE_URL:http://localhost:3000}
    # Customer portal (e-commerce-business): emailed links for CUSTOMER accounts. Blank = app-base-url.
    customer-portal-base-url: ${CUSTOMER_PORTAL_BASE_URL:}
    password:
      min-length: 10
      # BCrypt ignores bytes past 72; capping here stops a long passphrase from
      # being silently truncated.
      max-length: 72
      require-letter: true
      require-digit: true
      require-mixed-case: false
      require-special: false
      reject-common-passwords: true
      # Forced rotation, disabled by default: NIST SP 800-63B advises against it.
      max-age: 0s
  security:
    # AES-256-GCM key (base64, 32 decoded bytes) for values that must live in the DB
    # rather than purely in env vars — e.g. a company's own Razorpay key secret
    # (CompanyRazorpayConfig). No default: saving such a secret without this key
    # configured fails at that point, not silently. Generate with: openssl rand -base64 32
    encryption-key: ${SECRETS_ENCRYPTION_KEY:}

  storage:
    s3:
      # Off by default, same fail-closed shape as payment.razorpay below: a deployment
      # without a bucket configured gets UnconfiguredFileStorage, which refuses every
      # POD upload with a clear 422 instead of silently discarding the file.
      enabled: ${AWS_S3_ENABLED:false}
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:us-east-1}
      # Credentials are never read from config here — the AWS SDK's default provider
      # chain resolves them (env vars locally, the EC2 instance role in production).

  geocoding:
    # On by default: Nominatim (OpenStreetMap) is free and keyless, unlike S3/Razorpay
    # below there is no secret forcing an off-by-default. A miss or a disabled provider
    # just leaves a branch's latitude/longitude null — never blocks creating it.
    enabled: ${GEOCODING_ENABLED:true}
    base-url: ${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
    # Nominatim's usage policy requires a real identifying User-Agent on every request.
    user-agent: "${GEOCODING_USER_AGENT:courier-management-app (contact: set GEOCODING_USER_AGENT)}"
    connect-timeout: 3s
    read-timeout: 5s

  routing:
    # On by default: OSRM's public demo server is free and keyless. It is rate-limited
    # and not meant for production traffic — point base-url at a self-hosted OSRM
    # instance before this app's volume grows past what the demo server tolerates.
    enabled: ${ROUTING_ENABLED:true}
    base-url: ${ROUTING_BASE_URL:https://router.project-osrm.org}
    connect-timeout: 3s
    read-timeout: 8s

  payment:
    razorpay:
      # Off by default and no default secret: a deployment without credentials refuses
      # online recharge outright (422) rather than crediting wallets for payments nobody
      # made. Manual credit by a company admin still works. Enabling this without both
      # keys fails at startup, not at the first recharge.
      enabled: ${RAZORPAY_ENABLED:false}
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      # Separate secret from the Razorpay dashboard's own Webhooks screen, not key-secret.
      # Blank means the webhook endpoint verifies nothing and refuses every event — so a
      # tab-closed-mid-payment recharge stays uncredited until this is set, same fail-closed
      # shape as the rest of this block.
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
      api-base-url: ${RAZORPAY_API_URL:https://api.razorpay.com/v1}
      merchant-name: ${RAZORPAY_MERCHANT_NAME:Courier SaaS}
      connect-timeout: 5s
      read-timeout: 15s

  ewaybill:
    gsp:
      # Off by default and no default credentials: a deployment without a real GSP
      # integration gets UnconfiguredEwayBillProvider, which fails E-Way Bill generation
      # gracefully (a shipment/manifest is never blocked by it) instead of fabricating a
      # fake E-Way Bill number. Enabling this without base-url/client-id/client-secret
      # fails at startup, not at the first booking. See EwayBillGspProperties.
      enabled: ${EWAYBILL_GSP_ENABLED:false}
      base-url: ${EWAYBILL_GSP_BASE_URL:}
      client-id: ${EWAYBILL_GSP_CLIENT_ID:}
      client-secret: ${EWAYBILL_GSP_CLIENT_SECRET:}
      username: ${EWAYBILL_GSP_USERNAME:}
      password: ${EWAYBILL_GSP_PASSWORD:}
      gstin: ${EWAYBILL_GSP_GSTIN:}
      connect-timeout: 5s
      read-timeout: 15s

  communication:
    # Each channel defaults to log-only (LogOnlyWhatsAppProvider/LogOnlySmsProvider/
    # LogOnlyEmailProvider) — no dev-environment vendor account exists to call for real.
    # Per-company Phone Number ID/API URL/from-email etc. still live in the
    # communication_setting table regardless of these flags; this only selects whether
    # this deployment makes real outbound HTTP/SMTP calls at all.
    whatsapp:
      enabled: ${COMMUNICATION_WHATSAPP_ENABLED:false}
      # Prefixed to a bare 10-digit customer phone before it goes to Meta (which needs the country code).
      # Must match the language the template was approved in (Meta's own hello_world is en_US).
      template-language: ${COMMUNICATION_WHATSAPP_TEMPLATE_LANGUAGE:en_US}
      # Meta calls /api/v1/webhooks/whatsapp with delivery receipts. One Meta app serves the whole
      # deployment, so these are platform-level secrets (env only, never logged, no default):
      #   verify-token = any string you also type into Meta's "Verify token" box
      #   app-secret   = the Meta app's "App secret" (App settings > Basic)
      # Both unset = the endpoint answers 503 and Delivered/Read stay at 0.
      webhook:
        verify-token: ${COMMUNICATION_WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
        app-secret: ${COMMUNICATION_WHATSAPP_APP_SECRET:}
      default-country-code: ${COMMUNICATION_WHATSAPP_DEFAULT_COUNTRY_CODE:91}
    sms:
      enabled: ${COMMUNICATION_SMS_ENABLED:false}
    email:
      # true = real SMTP for every e-mail (account links, KYC codes, invoices, notifications). Also set
      # SPRING_MAIL_HOST / SPRING_MAIL_PORT / SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD and, for port 587,
      # SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true. The From address defaults to the SMTP user name.
      enabled: ${COMMUNICATION_EMAIL_ENABLED:false}
      from-address: ${COMMUNICATION_EMAIL_FROM:${spring.mail.username:no-reply@occplsoftech.com}}
      from-name: ${COMMUNICATION_EMAIL_FROM_NAME:OCCPL}
    retry:
      max-attempts: ${COMMUNICATION_RETRY_MAX_ATTEMPTS:5}
      backoff-minutes: ${COMMUNICATION_RETRY_BACKOFF_MINUTES:15}
    dispatch:
      fixed-delay-ms: ${COMMUNICATION_DISPATCH_INTERVAL_MS:30000}
    # {trackingNumber} is substituted — the public tracking page this frontend already
    # serves at /track/:awb.
    tracking-url-template: ${COMMUNICATION_TRACKING_URL_TEMPLATE:http://localhost:4200/track/{trackingNumber}}

  kyc:
    # Also write each KYC one-time code to the application log. For a development server without e-mail or
    # SMS set up only — never on production.
    log-codes: ${KYC_LOG_CODES:false}

  master:
    pincode-lookup:
      # India Post's free public directory, no key needed — on by default, unlike every
      # other provider flag in this file. Set false to opt a deployment out (offline dev
      # box, a network policy blocking the call); the create form falls back to the
      # manual Area picker.
      enabled: ${MASTER_PINCODE_LOOKUP_ENABLED:true}

  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:4200
      - http://localhost:5173
      # proxy.conf.verify.json's own verification dev server (npx ng serve --port 4300) —
      # otherwise its login POST gets a bare CORS 403 that renders as "Invalid credentials".
      - http://localhost:4300
    allow-credentials: false

pod:
  ai:
    # heuristic (default, deterministic local scorer, no vendor call) | vision (real AI
    # vision call, needs POD_AI_VISION_API_KEY) | disabled (always routes to manual review,
    # simulating an unreachable/unconfigured AI vendor).
    provider: ${POD_AI_PROVIDER:heuristic}
    vision:
      api-key: ${POD_AI_VISION_API_KEY:}
      base-url: ${POD_AI_VISION_BASE_URL:https://api.anthropic.com/v1}
      model: ${POD_AI_VISION_MODEL:claude-sonnet-4-5}
      connect-timeout: 5s
      read-timeout: 20s
  verification:
    manual-review-threshold: ${POD_MANUAL_REVIEW_THRESHOLD:60}

pricing:
  volumetric-divisor: 5000
  fuel-enabled: true
  oda-enabled: true
  insurance-enabled: true
  discount-enabled: true
  rounding-rule: NEAREST_FIVE

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    redis:
      enabled: true

logging:
  level:
    root: INFO
    com.courier: ${LOG_LEVEL:INFO}
  # requestId and companyId come from the MDC and are what tie a support ticket to
  # a log line — see RequestIdFilter and TenantResolutionFilter.
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] [%X{companyId:-}] %logger{36} - %msg%n"

# OCCPL SaaS platform integration (provisioning endpoint). Off unless enabled; see
# MEMORY/modules/platform-integration.md.
occpl:
  platform:
    enabled: ${OCCPL_PLATFORM_ENABLED:false}
    issuer-uri: ${OCCPL_PLATFORM_ISSUER_URI:}
    jwk-set-uri: ${OCCPL_PLATFORM_JWK_SET_URI:}
    audience: ${OCCPL_PLATFORM_AUDIENCE:}
    provisioning-client-id: ${OCCPL_PLATFORM_PROVISIONING_CLIENT_ID:occpl-core-services}
    default-plan-code: ${OCCPL_PLATFORM_DEFAULT_PLAN_CODE:}
    default-mobile: ${OCCPL_PLATFORM_DEFAULT_MOBILE:}
    # "Sign in with OCCPL": the Keycloak client people use (token azp), and this app's own service client
    # for asking the platform who may sign in.
    web-client-id: ${OCCPL_PLATFORM_WEB_CLIENT_ID:courier-web}
    core-base-url: ${OCCPL_PLATFORM_CORE_BASE_URL:}
    core-token-uri: ${OCCPL_PLATFORM_CORE_TOKEN_URI:}
    service-client-id: ${OCCPL_PLATFORM_SERVICE_CLIENT_ID:courier-service}
    service-client-secret: ${OCCPL_PLATFORM_SERVICE_CLIENT_SECRET:}
